[mgr]
prepend_keymap = [
    # Close input by once Esc press
    { on = "<C-c>", run = "close", desc = "Cancel input" },
    # Diff file
    { on = "<C-d>", run = "plugin diff", desc = "Diff the selected with the hovered file" },
    # Open shell (bash), NOTE: windows git-bash use $SHELL not work
    { on = "<C-s>", run = 'shell "bash" --block --confirm', for = "windows", desc = "Open shell here" },
    # Open explorer
    { on = "<C-e>", run = 'shell "explorer ." --confirm', desc = "Open explorer for windows" },
    # Open editor (code) here
    { on = "<C-o>", run = 'shell "code ." --confirm', desc = "Open EDITOR(CWD)" },

    # Smart-enter
    { on = "l", run = "plugin smart-enter", desc = "Enter the child directory, or open the file" },
    # Smart-paste
    { on = "p", run = "plugin smart-paste", desc = "Paste into the hovered directory or CWD" },
    # Copy selected files to the system clipboard while yanking
    { on = "y", run = [
        ''' shell 'echo "$@" | xclip -i -selection clipboard -t text/uri-list' --confirm
    ''',
        "yank",
    ], desc = "Paste into the hovered directory or CWD" },
    # Maximize preview pane
    { on = "T", run = "plugin toggle-pane max-preview", desc = "Maximize or restore the preview pane" },
    # Zoom in or out the preview image of a file
    { on = "+", run = "plugin zoom 1", desc = "Zoom in hovered file" },
    { on = "-", run = "plugin zoom -1", desc = "Zoom out hovered file" },

    # compress(archive)
    { on = [
        "c",
        "a",
    ], run = "plugin compress", desc = "Archive selected files" },
    # vcs-files
    { on = [
        "g",
        "c",
    ], run = "plugin vcs-files", desc = "Show Git file changes" },
    # lazygit
    { on = [
        "g",
        "i",
    ], run = "plugin lazygit", desc = "Run lazygit" },
]

[input]

prepend_keymap = [
    # close input by once Esc press
    { on = "<Esc>", run = "close", desc = "Cancel input" },
]
